name: Release Build

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            archive: tar.gz
          - goos: windows
            goarch: amd64
            archive: zip
          - goos: windows
            goarch: arm64
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Build runtime package
        env:
          TARGETOS: ${{ matrix.goos }}
          TARGETARCH: ${{ matrix.goarch }}
        run: go run ./cmd/build -out "$RUNNER_TEMP/package"

      - name: Add release metadata
        run: cp config.example.json README.md LICENSE "$RUNNER_TEMP/package/"

      - name: Create archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ARCHIVE: ${{ matrix.archive }}
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          name="workbuddy2api-${VERSION}-${GOOS}-${GOARCH}"
          if [ "$ARCHIVE" = "zip" ]; then
            (cd "$RUNNER_TEMP/package" && zip -qr "$GITHUB_WORKSPACE/dist/${name}.zip" .)
          else
            tar -C "$RUNNER_TEMP/package" -czf "dist/${name}.tar.gz" .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.release.tag_name }}
        run: gh release upload "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --clobber
